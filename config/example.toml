# Stonemite configuration
# Stored at %APPDATA%\Stonemite\config.toml

# Path to the EverQuest installation directory.
eq_dir = "C:\\Users\\Public\\Daybreak Game Company\\Installed Games\\EverQuest"

# Key to toggle PiP overlay visibility (F1-F24, Pause, ScrollLock, Insert, Delete, Home, End, PageUp, PageDown).
hide_hotkey = "F9"

# Hold-to-broadcast mouse key. F13 is the default; set empty to unbind.
# Keyboard-emulating foot pedals and F13-F24 are supported.
mouse_clutch_key = "F13"

# Screen edge for PiP strip: right, left, top, bottom
pip_edge = "right"

# Custom PiP strip size in pixels (omit for auto-size, double-click edge to reset)
# pip_strip_width = 200

# Snap grid size in pixels for free PiP placement (0 = no grid snap)
# snap_grid = 16

# PiP label height in pixels (default 48, try 32 for compact or 56 for large)
# pip_label_height = 48

# PiP label opacity as a percentage, 0–100 (default 80)
# pip_label_opacity = 80

# Character-name typography. Family must be an installed Windows font;
# scale is 60–120% of the automatic size; weight is regular, semibold, bold, or heavy.
# pip_label_font_family = "Segoe UI"
# pip_label_font_scale = 100
# pip_label_font_weight = "bold"

# Automatically order PiP windows by slot number (default true)
# auto_order = true

# Preferred global box order. Character/server matching is case-insensitive;
# missing entries are skipped and unlisted characters follow the configured list.
# box_order = [
#   { server = "xegony", character = "Laika" },
#   { server = "xegony", character = "Bilka" },
#   { server = "bristlebane", character = "Foo" },
# ]

# Hide background EQ windows from Alt-Tab (active window stays visible)
# hide_from_alt_tab = true

# Box notifications: highlight the receiving background PiP and play one of
# the bundled EQ default audio-trigger sounds. Chat events use each character's
# configured EQ channel color; trade and other system events use Stonemite status colors.
# tell_visual_enabled = true
# tell_sound_enabled = true
# tell_sound = "tell.wav"
# notify_tells = true
# notify_group_invites = true
# notify_raid_invites = true
# notify_trade_proposals = true
# notify_resurrections = true
# notify_deaths = true

# Per-PiP custom positions (set via Edit Layout mode, or manually).
# Empty = auto strip layout. Each entry needs slot, x, y, width, height.
# [[pip_positions]]
# slot = 0
# x = 1600
# y = 100
# width = 320
# height = 228

# Toast notifications (shown on window swap, close, broadcast toggle)
# toast_enabled = true
# toast_height = 64
# toast_duration = 2.0

# Automatically check for updates on launch (default true, checks every 7 days)
# auto_update_check = true
# update_check_interval_days = 7

# Generic trushar control/state and targeted-input WebSocket API. The server is
# enabled by default on IPv4 loopback so trusted apps on this PC work without
# setup or authentication. Settings can disable integrations or configure
# paired local-network access. Targeted input also requires trusik = true.
# Integration settings require restart. A native localhost client sends no
# Origin header; browser-originated unauthenticated connections are rejected.
# [trushar]
# enabled = false
# bind = "127.0.0.1:19720"

# LAN access is explicit. Settings generates the long credential and pairs
# clients through a temporary six-digit code. For advanced manual setup, a
# wildcard or non-loopback bind requires a nonempty shared token or startup
# fails closed. Use only on a trusted network: ws:// authenticates the client
# but does not encrypt the credential or EQ state.
# bind = "0.0.0.0:19720"
# auth_token = "replace-with-a-long-random-token"
