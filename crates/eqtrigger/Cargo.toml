[package]
name = "eqtrigger"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
fancy-regex = "0.16"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
sha2 = "0.10"
